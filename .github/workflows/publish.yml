name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed CLI tag on main (for example cli-v0.0.4)
        type: string
        required: true

env:
  PRIMARY_NODE_VERSION: '24'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: validate the requested tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: validate tag identity and main ancestry
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          if ! [[ "$TAG" =~ ^cli-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::npm publication accepts only cli-vX.Y.Z tags"
            exit 1
          fi
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          commit=$(git rev-parse "${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::${TAG} does not point to a commit on main"
            exit 1
          fi
          run_json=$(gh run list --workflow ci.yml --branch main --event push --commit "$commit" --limit 100 --json databaseId,headSha,status,conclusion,createdAt \
            | jq -c --arg commit "$commit" '[.[] | select(.headSha == $commit)] | sort_by(.createdAt) | reverse | .[0] // empty')
          if [ -z "$run_json" ]; then echo "::error::no main CI run exists for $commit"; exit 1; fi
          run_id=$(jq -r .databaseId <<< "$run_json")
          gh run watch "$run_id" --exit-status
          ci_result=$(gh run view "$run_id" --json headSha,conclusion)
          if [ "$(jq -r .headSha <<< "$ci_result")" != "$commit" ] || [ "$(jq -r .conclusion <<< "$ci_result")" != success ]; then
            echo "::error::main CI did not pass for the exact CLI tag SHA"; exit 1
          fi
          version=${TAG#cli-v}
          package_version=$(git show "${TAG}:package.json" | node -e "let input='';process.stdin.on('data',chunk=>input+=chunk).on('end',()=>process.stdout.write(JSON.parse(input).version))")
          if [ "$package_version" != "$version" ]; then
            echo "::error::${TAG} does not match package.json version ${package_version}"
            exit 1
          fi
          git show "${TAG}:CHANGELOG.md" | grep -F "## [${version}]" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: require configured npm-publish reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          environment=$(gh api "repos/${GITHUB_REPOSITORY}/environments/npm-publish")
          if ! jq -e '[.protection_rules[]? | select(.type == "required_reviewers" and (.reviewers | length > 0))] | length > 0' <<< "$environment" >/dev/null; then
            echo "::error::npm-publish must have at least one required reviewer configured before npm publication"
            exit 1
          fi
          echo "npm-publish required reviewers are configured." >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: release checks
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm --filter ligule run test

      - name: syntax check compiled modules and checks
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          for file in scripts/*.js test/*.js; do node --check "$file"; done

      - name: check the packed artifact
        run: pnpm --filter ligule run check-pack

      - name: pack the exact npm artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-tarball
          pnpm --filter ligule run pack-release dist-tarball
          version='${{ needs.preflight.outputs.version }}'
          tarball="dist-tarball/ligule-${version}.tgz"
          test -f "$tarball"
          sha256sum "$tarball" > dist-tarball/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball/
          if-no-files-found: error

  registry-check:
    name: check the main package version before publishing
    needs: [preflight, checks]
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.registry.outputs.state }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: install frozen workspace dependencies for registry helper
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball

      - name: compare the package tarball with the registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist-tarball/SHA256SUMS
          version='${{ needs.preflight.outputs.version }}'
          state=$(pnpm --filter ligule run --silent registry-version "ligule@${version}" "dist-tarball/ligule-${version}.tgz")
          echo "state=$state" >> "$GITHUB_OUTPUT"

  approval:
    name: release approval
    needs: [preflight, registry-check]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - run: echo "npm publication is approved to proceed"

  verify:
    name: verify the packed tarball by installing it
    needs: [preflight, checks, registry-check, approval]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: build the host entry points for verification
        run: pnpm --filter ligule run build

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball

      - name: install the tarball into an empty consumer
        run: pnpm --filter ligule run verify-install "$PWD/dist-tarball/ligule-${{ needs.preflight.outputs.version }}.tgz"

  npm:
    name: publish to npm
    needs: [preflight, checks, registry-check, approval, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: install npm CLI with trusted publishing support
        run: npm install --global npm@11.5.1

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball

      - name: verify tarball identity
        id: tarball
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist-tarball/SHA256SUMS
          file="dist-tarball/ligule-${{ needs.preflight.outputs.version }}.tgz"
          echo "path=./$file" >> "$GITHUB_OUTPUT"
          echo "state=${{ needs.registry-check.outputs.state }}" >> "$GITHUB_OUTPUT"

      - name: publish with trusted publishing
        if: needs.registry-check.outputs.state == 'missing'
        run: npm publish --provenance --access public "${{ steps.tarball.outputs.path }}"
