name: publish

# 一次发布就是一个标签：把 `src/version.js` 的 VERSION 与十份带着版本号的清单一起改好，再推 vX.Y.Z——
# 哪十份由 `test/kernel.test.js` 那条检查说，它对不上时先在测试那一趟红。
# 标签必须落在 main 已经带着的那个提交上，标签名必须等于 package.json 的 version，下面两步各查一件。
#
# 鉴权：npm 的 Trusted Publishing（OIDC）需要包先存在才能绑定发布者，所以第一次发布用
# NPM_TOKEN；包上了 registry 之后配好 trusted publisher、删掉那个 secret，往后的发布走 OIDC。

on:
  push:
    tags: ['v*']

env:
  # 与 ci.yml 和 package.json 的 engines.node 取同一个大版本号，test/runtime-version.test.js 断言这一点。
  PRIMARY_NODE_VERSION: '24'

# 发布不能跑到一半被取消：第一个标签还在上传 npm 时又来一个标签会和 registry 抢。
# 所以这里排队，不取消。
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # 下面要比对标签提交与 main 的祖先关系，按标签默认检出既没有那个分支也没有足够深的历史。
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm

      # 依赖按锁文件装，CI 上不解析新版本。
      - name: install
        run: npm ci

      - name: tag matches package.json version
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      # 标签是这次发布的身份，它必须指向 main 已经带着的提交；否则一个旁支上的标签会发布
      # 一份没有任何分支被评审过的代码。
      - name: tag points at a commit on main
        shell: bash
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi

      # node --check 只解析单个文件、不 import 别的文件，所以这三处任何一处语法错误都在这里失败。
      - name: syntax check every module
        shell: bash
        run: |
          set -e
          for f in src/*.js scripts/*.js test/*.js; do node --check "$f"; done

      - name: test
        run: npm test

      - name: check the packed artifact
        run: npm run check-pack

      # 打一次包就是这次发布的身份：tarball 与它的 SHA-256 交给下游两个作业，谁都不再重新打一次。
      - name: pack the tarball the release publishes
        shell: bash
        run: |
          set -e
          mkdir -p dist-tarball
          npm pack --pack-destination dist-tarball
          tarball=$(ls dist-tarball/*.tgz | head -1)
          sha256sum "$tarball" | tee dist-tarball/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball/
          if-no-files-found: error

  # 装一次真的：空目录里安装上面那一份字节，依赖按声明解析，再查版本、工具数、TUI 那一条拒绝、
  # 两种命令语法与搜索后端。check-pack 从开发树复制依赖，证明不了「声明装得出来」。
  verify:
    name: verify the packed tarball by installing it
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm

      - name: install
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball

      - name: install the tarball into an empty consumer and check it
        run: npm run verify-install -- "$PWD/dist-tarball/ligule-$(node -p "require('./package.json').version").tgz"

  npm:
    name: publish to npm
    needs: [checks, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / Trusted Publishing（OIDC）。
    env:
      # 读一次，让下面两个发布步骤互斥。
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # setup-node 写的 .npmrc 按这个变量取凭据；配了 NPM_TOKEN 时三个包都用它，没配就走 OIDC。
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # 平台包的内容不提交进仓库：按 scripts/ripgrep-pin.json 写明的版本与校验和拉取解包。
      - name: build the ripgrep platform packages
        run: npm run build-rg

      - name: skip when version is already published
        id: published
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          if npm view --json "ligule@${pkg}" version > /dev/null 2>&1; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "::warning::${pkg} is already on npm - nothing to publish"
          fi

      # 两个平台包先于主包发布：主包的 optionalDependencies 指向它们，晚一步就有人装到 404。
      # 每个包自己查一次 registry，重跑不会因为已发布而以 E409 失败。
      - name: publish the ripgrep platform packages
        if: steps.published.outputs.already != 'yes'
        shell: bash
        run: |
          for dir in packages/rg-*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view --json "$name@$version" version > /dev/null 2>&1; then
              echo "::warning::$name@$version is already on npm - skipping"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public)
          done

      # 发的是验过的那一份字节：作业自己不打第二份包，从 artifact 里取下来直接发。
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball

      - name: take the tarball identity from the artifact
        id: tarball
        shell: bash
        run: echo "path=$(ls dist-tarball/*.tgz | head -1)" >> "$GITHUB_OUTPUT"

      - name: publish to npm (token)
        if: steps.published.outputs.already != 'yes' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public "${{ steps.tarball.outputs.path }}"

      - name: publish to npm (trusted publishing)
        if: steps.published.outputs.already != 'yes' && env.NPM_TOKEN == ''
        run: npm publish --provenance --access public "${{ steps.tarball.outputs.path }}"

  release:
    name: create GitHub release
    needs: [checks, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建对应的 GitHub Release。
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 四行桌面产物由 `ci.yml` 的那一矩阵构出来并上传成检查附件，这条流水线不把任何附件挂到 Release 上，所以只以 draft 建出来：
      # 缺附件的那一份不能算完整交付，公开与否由人在验收之后点。
      - name: GitHub release (idempotent, kept draft)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::warning::release $GITHUB_REF_NAME already exists - refreshing its notes"
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft=true --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft=true --generate-notes
          fi
