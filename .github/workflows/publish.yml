name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing, reviewed release tag on main (for example v0.0.2)
        type: string
        required: true

env:
  PRIMARY_NODE_VERSION: '24'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: validate the requested tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: validate tag identity and main ancestry
        id: identity
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag must use vX.Y.Z form"
            exit 1
          fi
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          commit=$(git rev-parse "${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::${TAG} does not point to a commit on main"
            exit 1
          fi
          version=${TAG#v}
          package_version=$(git show "${TAG}:package.json" | node -e "let input='';process.stdin.on('data',chunk=>input+=chunk).on('end',()=>process.stdout.write(JSON.parse(input).version))")
          if [ "$package_version" != "$version" ]; then
            echo "::error::${TAG} does not match package.json version ${package_version}"
            exit 1
          fi
          git show "${TAG}:CHANGELOG.md" | grep -F "## [${version}]" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  checks:
    name: release checks
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm

      - name: install locked dependencies
        run: npm ci

      - name: build pinned search packages
        run: npm run build-rg

      - name: syntax check every module
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js scripts/*.js test/*.js; do node --check "$file"; done

      - name: test
        run: npm test

      - name: check the packed artifact
        run: npm run check-pack

      - name: pack the exact npm artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-tarball
          npm run pack-release -- dist-tarball
          version='${{ needs.preflight.outputs.version }}'
          tarball="dist-tarball/ligule-${version}.tgz"
          test -f "$tarball"
          sha256sum "$tarball" | tee dist-tarball/SHA256SUMS
          mkdir -p dist-tarball/platforms
          for directory in packages/rg-*; do npm pack "./$directory" --pack-destination dist-tarball/platforms; done
          sha256sum dist-tarball/platforms/*.tgz >> dist-tarball/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball/
          if-no-files-found: error

  registry-check:
    name: check every registry version before publishing
    needs: [preflight, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball

      - name: compare all five package tarballs with the registry
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist-tarball/SHA256SUMS
          version='${{ needs.preflight.outputs.version }}'
          npm run --silent registry-version -- "ligule@${version}" "dist-tarball/ligule-${version}.tgz"
          for file in dist-tarball/platforms/*.tgz; do
            name=$(basename "$file" "-${version}.tgz")
            npm run --silent registry-version -- "${name}@${version}" "$file"
          done

  approval:
    name: release approval
    needs: [preflight, registry-check]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - run: echo "npm publication is approved to proceed"

  platforms:
    name: publish search packages
    needs: [preflight, checks, registry-check, approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball

      - name: verify checksums
        run: sha256sum --check dist-tarball/SHA256SUMS

      - name: publish each exact platform artifact
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          for file in dist-tarball/platforms/*.tgz; do
            name=$(basename "$file" "-${version}.tgz")
            state=$(npm run --silent registry-version -- "${name}@${version}" "$file")
            if [ "$state" = missing ]; then npm publish --provenance --access public "$file"; fi
            npm run --silent registry-version -- "${name}@${version}" "$file"
          done

  verify:
    name: verify the packed tarball by installing it
    needs: [preflight, checks, registry-check, approval, platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm

      - name: install locked dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball

      - name: install the tarball into an empty consumer
        run: npm run verify-install -- "$PWD/dist-tarball/ligule-${{ needs.preflight.outputs.version }}.tgz"

  npm:
    name: publish to npm
    needs: [preflight, checks, registry-check, approval, platforms, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-tarball

      - name: verify tarball identity
        id: tarball
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist-tarball/SHA256SUMS
          file="dist-tarball/ligule-${{ needs.preflight.outputs.version }}.tgz"
          echo "path=$file" >> "$GITHUB_OUTPUT"
          state=$(npm run --silent registry-version -- "ligule@${{ needs.preflight.outputs.version }}" "$file")
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: publish with token
        if: steps.tarball.outputs.state == 'missing' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public "${{ steps.tarball.outputs.path }}"

      - name: publish with trusted publishing
        if: steps.tarball.outputs.state == 'missing' && env.NPM_TOKEN == ''
        run: npm publish --provenance --access public "${{ steps.tarball.outputs.path }}"

  release-notes:
    name: create or refresh the draft Release
    needs: [preflight, npm]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
