name: publish

# 一次发布就是一个标签：把 package.json 与 src/index.js 里的 VERSION 一起改好，再推 vX.Y.Z。
# 标签必须落在 main 已经带着的那个提交上，标签名必须等于 package.json 的 version，下面两步各查一件。
#
# 鉴权：npm 的 Trusted Publishing（OIDC）需要包先存在才能绑定发布者，所以第一次发布用
# NPM_TOKEN；包上了 registry 之后配好 trusted publisher、删掉那个 secret，往后的发布走 OIDC。

on:
  push:
    tags: ['v*']

env:
  # 与 ci.yml 和 package.json 的 engines.node 取同一个大版本号，test/runtime-version.test.js 断言这一点。
  PRIMARY_NODE_VERSION: '24'

# 发布不能跑到一半被取消：第一个标签还在上传 npm 时又来一个标签会和 registry 抢。
# 所以这里排队，不取消。
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # 下面要比对标签提交与 main 的祖先关系，按标签默认检出既没有那个分支也没有足够深的历史。
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: tag matches package.json version
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      # 标签是这次发布的身份，它必须指向 main 已经带着的提交；否则一个旁支上的标签会发布
      # 一份没有任何分支被评审过的代码。
      - name: tag points at a commit on main
        shell: bash
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi

      # node --check 只解析单个文件、不 import 别的文件，所以这三处任何一处语法错误都在这里失败。
      - name: syntax check every module
        shell: bash
        run: |
          set -e
          for f in src/*.js scripts/*.js test/*.js; do node --check "$f"; done

      - name: test
        run: npm test

      - name: check the packed artifact
        run: npm run check-pack

  npm:
    name: publish to npm
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / Trusted Publishing（OIDC）。
    env:
      # 读一次，让下面两个发布步骤互斥。
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: skip when version is already published
        id: published
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          if npm view --json "ligule@${pkg}" version > /dev/null 2>&1; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "::warning::${pkg} is already on npm - nothing to publish"
          fi

      - name: publish to npm (token)
        if: steps.published.outputs.already != 'yes' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: publish to npm (trusted publishing)
        if: steps.published.outputs.already != 'yes' && env.NPM_TOKEN == ''
        run: npm publish --provenance --access public

  release:
    name: create GitHub release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建对应的 GitHub Release。
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 重跑要收敛而不是因为名字被占而失败。
      - name: GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::warning::release $GITHUB_REF_NAME already exists - refreshing its notes"
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
