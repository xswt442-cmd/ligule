name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      include_macos:
        description: Run optional macOS compatibility jobs
        type: boolean
        required: false
        default: false

env:
  PRIMARY_NODE_VERSION: '24'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  credentials:
    name: native credentials on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'macos-') }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_macos && '["windows-latest","ubuntu-22.04","macos-15","macos-15-intel"]' || '["windows-latest","ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: prepare persistent Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring
      - name: native credential operations on Linux
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "ligule-ci-test-password" | gnome-keyring-daemon --unlock --components=secrets
            LIGULE_CREDENTIAL_NATIVE_REQUIRED=1 node --test core/tests/credentials.test.js core/tests/credential-unavailable.test.js
          '
      - name: prepare an isolated macOS keychain
        id: keychain
        if: runner.os == 'macOS'
        run: |
          mkdir -p testplace/tmp
          security create-keychain -p ligule-ci-test-password "$PWD/testplace/tmp/credentials.keychain-db"
          security set-keychain-settings -lut 21600 "$PWD/testplace/tmp/credentials.keychain-db"
          security unlock-keychain -p ligule-ci-test-password "$PWD/testplace/tmp/credentials.keychain-db"
          security list-keychains -d user -s "$PWD/testplace/tmp/credentials.keychain-db"
          security default-keychain -d user -s "$PWD/testplace/tmp/credentials.keychain-db"
      - name: native credential operations on Windows and macOS
        if: runner.os != 'Linux'
        env:
          LIGULE_CREDENTIAL_NATIVE_REQUIRED: '1'
        run: node --test core/tests/credentials.test.js core/tests/credential-unavailable.test.js
      - name: remove the test keychain
        if: always() && runner.os == 'macOS' && steps.keychain.outcome == 'success'
        run: security delete-keychain "$PWD/testplace/tmp/credentials.keychain-db"

  test:
    name: shared tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install bubblewrap for Linux sandbox tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: allow bubblewrap user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: build Core for required Linux sandbox probe
        if: runner.os == 'Linux'
        run: pnpm run build:core
      - name: require the Linux sandbox isolation probe
        if: runner.os == 'Linux'
        run: >-
          node --input-type=module -e "import { probeLinuxSandboxIsolation } from './core/dist/capability/sandbox-linux.js';
          const result = await probeLinuxSandboxIsolation();
          if (!result.available) { throw new Error(result.reason ?? 'Linux isolation probe failed'); }"
      - name: syntax check JavaScript source and tests
        run: pnpm check:syntax
      - name: enforce source dependency boundaries
        run: pnpm check:dependencies
      - name: test
        run: pnpm test

  eval-smoke:
    name: deterministic Harbor and ATIF smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.5
          python-version: '3.12'
          enable-cache: false
      - name: install
        run: pnpm install --frozen-lockfile
      - name: run deterministic evaluation smoke
        run: pnpm run eval:smoke

  cli-package:
    name: build CLI package artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: check the packed artifact
        run: pnpm --filter ligule run check-pack
      - uses: actions/upload-artifact@v7
        with:
          name: ligule-cli-tarball-${{ github.run_id }}
          path: testplace/pack/*.tgz
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  cli-consumer:
    name: CLI clean consumer on ${{ matrix.os }}
    needs: cli-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install verifier dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: ligule-cli-tarball-${{ github.run_id }}
          path: dist-tarball
      - name: install the shared tarball into an empty consumer
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $tarball = (Resolve-Path (Join-Path $PWD 'dist-tarball/*.tgz')).Path
          pnpm --filter ligule run verify-install "$tarball"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: install the shared tarball into an empty consumer
        if: runner.os == 'Linux'
        run: pnpm --filter ligule run verify-install "$(realpath dist-tarball/*.tgz)"

  desktop:
    name: Electron desktop on ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.id, 'macos-') }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_macos && '[{"id":"windows-x64","os":"windows-latest","node":"desktop/vendor/node/node.exe"},{"id":"linux-x64","os":"ubuntu-22.04","node":"desktop/vendor/node/node"},{"id":"macos-arm64","os":"macos-15","node":"desktop/vendor/node/node"},{"id":"macos-x64","os":"macos-15-intel","node":"desktop/vendor/node/node"}]' || '[{"id":"windows-x64","os":"windows-latest","node":"desktop/vendor/node/node.exe"},{"id":"linux-x64","os":"ubuntu-22.04","node":"desktop/vendor/node/node"}]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install Linux native build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb libgtk-3-0 libnss3 libgbm1 libasound2 libxss1 libxtst6 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 libatspi2.0-0 libsecret-1-0
      - name: install locked packages
        run: pnpm install --frozen-lockfile
      - name: build the Host runtime tree
        run: pnpm run build:core
      - name: test Electron Host and security contracts
        run: node --experimental-strip-types --test desktop/electron/tests/host.test.ts desktop/electron/tests/security.test.ts
      - name: check and build the frontend
        run: |
          pnpm --filter ligule-desktop-frontend run check
          pnpm --filter ligule-desktop-frontend run build
      - name: compile the Electron main process
        run: pnpm exec tsc -p desktop/electron/tsconfig.json
      - name: prepare the target Node runtime and Host resources
        run: pnpm run prepare-runtime
      - name: run the packaged runtime tree checks
        shell: bash
        run: ${{ matrix.node }} desktop/check-runtime.mjs --vendor desktop/vendor
      - name: test Windows Host Job Object process-tree cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $PWD 'desktop/vendor/node/node.exe') --experimental-strip-types --test desktop/electron/tests/process-tree.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: test POSIX Host process-group cleanup and orphan watchdog
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.node }} --experimental-strip-types --test desktop/electron/tests/posix-process-tree.test.ts
      - name: test real Electron security and stub-model windows
        shell: pwsh
        run: |
          $node = if ($IsWindows) { Join-Path $PWD 'desktop/vendor/node/node.exe' } else { Join-Path $PWD 'desktop/vendor/node/node' }
          function Invoke-WindowTest([string]$script) {
            if ($IsLinux) { & xvfb-run -a $node $script } else { & $node $script }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Invoke-WindowTest 'desktop/electron/tests/run-native-security.mjs'
          Invoke-WindowTest 'desktop/electron/tests/run-stub-model.mjs'
      - name: test Windows native dialogs and tray window lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $PWD 'desktop/vendor/node/node.exe') desktop/electron/tests/run-native-features.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ligule-desktop-evidence-${{ matrix.id }}-${{ github.sha }}
          path: desktop/testplace/readings/
          if-no-files-found: ignore
          retention-days: 14
