name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      include_macos:
        description: Run optional macOS compatibility jobs
        type: boolean
        required: false
        default: false

env:
  PRIMARY_NODE_VERSION: '24'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  credentials:
    name: native credentials on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'macos-') }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_macos && '["windows-latest","ubuntu-22.04","macos-15","macos-15-intel"]' || '["windows-latest","ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ligule run build
      - name: prepare persistent Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring
      - name: native credential operations on Linux
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "ligule-ci-test-password" | gnome-keyring-daemon --unlock --components=secrets
            LIGULE_CREDENTIAL_NATIVE_REQUIRED=1 node --test test/credentials.test.js test/credential-unavailable.test.js
          '
      - name: prepare an isolated macOS keychain
        id: keychain
        if: runner.os == 'macOS'
        run: |
          mkdir -p testplace/tmp
          security create-keychain -p ligule-ci-test-password "$PWD/testplace/tmp/credentials.keychain-db"
          security set-keychain-settings -lut 21600 "$PWD/testplace/tmp/credentials.keychain-db"
          security unlock-keychain -p ligule-ci-test-password "$PWD/testplace/tmp/credentials.keychain-db"
          security list-keychains -d user -s "$PWD/testplace/tmp/credentials.keychain-db"
          security default-keychain -d user -s "$PWD/testplace/tmp/credentials.keychain-db"
      - name: native credential operations on Windows and macOS
        if: runner.os != 'Linux'
        env:
          LIGULE_CREDENTIAL_NATIVE_REQUIRED: '1'
        run: node --test test/credentials.test.js test/credential-unavailable.test.js
      - name: remove the test keychain
        if: always() && runner.os == 'macOS' && steps.keychain.outcome == 'success'
        run: security delete-keychain "$PWD/testplace/tmp/credentials.keychain-db"

  test:
    name: shared tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: syntax check source, scripts, and tests
        shell: bash
        run: |
          set -e
          for f in $(find src scripts test -name '*.js'); do node --check "$f"; done
      - name: test
        run: pnpm --filter ligule run test

  cli-package:
    name: CLI package and clean consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ligule run build
      - name: check the packed artifact
        run: pnpm --filter ligule run check-pack
      - name: install the packed artifact into an empty consumer
        run: pnpm --filter ligule run verify-install

  desktop:
    name: Electron desktop on ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.id, 'macos-') }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_macos && '[{"id":"windows-x64","os":"windows-latest","node":"desktop/vendor/node/node.exe","build":"build:win","artifact":"desktop/release/*.exe"},{"id":"linux-x64","os":"ubuntu-22.04","node":"desktop/vendor/node/node","build":"build:linux","artifact":"desktop/release/*.AppImage\ndesktop/release/*.deb"},{"id":"macos-arm64","os":"macos-15","node":"desktop/vendor/node/node","build":"build:mac","artifact":"desktop/release/*.dmg"},{"id":"macos-x64","os":"macos-15-intel","node":"desktop/vendor/node/node","build":"build:mac","artifact":"desktop/release/*.dmg"}]' || '[{"id":"windows-x64","os":"windows-latest","node":"desktop/vendor/node/node.exe","build":"build:win","artifact":"desktop/release/*.exe"},{"id":"linux-x64","os":"ubuntu-22.04","node":"desktop/vendor/node/node","build":"build:linux","artifact":"desktop/release/*.AppImage\ndesktop/release/*.deb"}]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install Linux native build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb libgtk-3-0 libnss3 libgbm1 libasound2 libxss1 libxtst6 libatk-bridge2.0-0 libdrm2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 libatspi2.0-0 libsecret-1-0
      - name: install locked packages
        run: pnpm install --frozen-lockfile
      - name: test Electron Host and security contracts
        run: node --experimental-strip-types --test desktop/electron/test/host.test.ts desktop/electron/test/security.test.ts
      - name: check and build the frontend
        run: |
          pnpm --filter ligule-desktop-frontend run check
          pnpm --filter ligule-desktop-frontend run build
      - name: build the Host runtime tree
        run: pnpm --filter ligule run build
      - name: prepare the target Node runtime and Host resources
        run: pnpm --filter ligule run prepare-runtime
      - name: run the packaged runtime tree checks
        shell: bash
        run: ${{ matrix.node }} desktop/check-runtime.mjs --vendor desktop/vendor
      - name: build the Electron installer
        run: |
          pnpm --filter ligule-desktop exec install-electron
          pnpm --filter ligule-desktop run ${{ matrix.build }}
      - name: test Windows Host Job Object process-tree cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $PWD 'desktop/vendor/node/node.exe') --experimental-strip-types --test desktop/electron/test/process-tree.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: test POSIX Host process-group cleanup and orphan watchdog
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.node }} --experimental-strip-types --test desktop/electron/test/posix-process-tree.test.ts
      - name: test real Electron security and stub-model windows
        shell: pwsh
        run: |
          $node = if ($IsWindows) { Join-Path $PWD 'desktop/vendor/node/node.exe' } else { Join-Path $PWD 'desktop/vendor/node/node' }
          function Invoke-WindowTest([string]$script) {
            if ($IsLinux) { & xvfb-run -a $node $script } else { & $node $script }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Invoke-WindowTest 'desktop/electron/test/run-native-security.mjs'
          Invoke-WindowTest 'desktop/electron/test/run-stub-model.mjs'
      - name: test Windows native dialogs and tray window lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $PWD 'desktop/vendor/node/node.exe') desktop/electron/test/run-native-features.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: install and test the Windows NSIS bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File desktop/electron/test/run-installer-smoke.ps1
      - name: extract Linux installers and test bundled runtimes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/ligule-bundle-smoke"
          mkdir -p "$scratch"
          verify_runtime() {
            local resources="$1"
            local node="$resources/node/node"
            test -x "$node"
            LIGULE_RUNTIME_APP_DIR="$resources/app" LIGULE_RUNTIME_NODE_PATH="$node" "$node" desktop/check-runtime.mjs --resources "$resources"
          }
          index=0
          for package in desktop/release/*.deb; do
            destination="$scratch/deb-$index"
            mkdir -p "$destination"
            dpkg-deb --extract "$package" "$destination"
            manifest=$(find "$destination" -type f -path '*/resources/app/package.json' -print -quit)
            test -n "$manifest"
            resources="${manifest%/app/package.json}"
            verify_runtime "$resources"
            app_directory=$(dirname "$resources")
            xvfb-run -a "${{ matrix.node }}" desktop/electron/test/run-packaged-smoke.mjs --app-dir "$app_directory"
            index=$((index + 1))
          done
          index=0
          for image in desktop/release/*.AppImage; do
            destination="$scratch/appimage-$index"
            mkdir -p "$destination"
            archive="$PWD/$image"
            (cd "$destination" && "$archive" --appimage-extract >/dev/null)
            manifest=$(find "$destination/squashfs-root" -type f -path '*/resources/app/package.json' -print -quit)
            test -n "$manifest"
            resources="${manifest%/app/package.json}"
            verify_runtime "$resources"
            app_directory=$(dirname "$resources")
            xvfb-run -a "${{ matrix.node }}" desktop/electron/test/run-packaged-smoke.mjs --app-dir "$app_directory"
            index=$((index + 1))
          done
      - name: verify macOS DMG and bundled runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for image in desktop/release/*.dmg; do
            hdiutil verify "$image"
            mount_point=$(mktemp -d "$RUNNER_TEMP/ligule-dmg.XXXXXX")
            trap 'hdiutil detach "$mount_point" || true' EXIT
            hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount_point"
            app="$mount_point/ligule.app/Contents/Resources"
            node="$app/node/node"
            LIGULE_RUNTIME_APP_DIR="$app/app" LIGULE_RUNTIME_NODE_PATH="$node" "$node" desktop/check-runtime.mjs --resources "$app"
            "$node" desktop/electron/test/run-packaged-smoke.mjs --app-dir "$mount_point/ligule.app"
            hdiutil detach "$mount_point"
            trap - EXIT
            rmdir "$mount_point"
          done
      - name: list generated desktop artifacts
        shell: bash
        run: ls -l desktop/release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ligule-desktop-evidence-${{ matrix.id }}-${{ github.sha }}
          path: desktop/testplace/readings/
          if-no-files-found: ignore
          retention-days: 14
      - name: read desktop package version
        id: desktop-version
        shell: bash
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ligule-desktop-v${{ steps.desktop-version.outputs.value }}-${{ matrix.id }}-${{ github.sha }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
