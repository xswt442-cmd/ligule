name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: syntax check every module
        shell: bash
        run: |
          set -e
          for f in src/*.js; do node --check "$f"; done

      - name: test
        run: npm test
