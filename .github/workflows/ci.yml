name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  # 运行时下限在这里写一次。package.json 的 engines.node、README 的徽章和两个工作流
  # 必须取同一个大版本号，test/runtime-version.test.js 断言这一点（D28）。
  PRIMARY_NODE_VERSION: '24'

# 同一分支上的新推送取消还在跑的那一次；main 上不取消，那一次承担发布前的最后一轮完整验证。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  credentials:
    name: native credentials on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm
      - name: install and build
        run: |
          npm ci
          npm run build
      - name: prepare persistent Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring
      - name: native credential operations on Linux
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "ligule-ci-test-password" | gnome-keyring-daemon --unlock --components=secrets
            LIGULE_CREDENTIAL_NATIVE_REQUIRED=1 node --test test/credentials.test.js test/credential-unavailable.test.js
          '
      - name: prepare an isolated macOS keychain
        id: keychain
        if: runner.os == 'macOS'
        run: |
          mkdir -p testplace/tmp
          security create-keychain -p ligule-ci-test-password "$PWD/testplace/tmp/credentials.keychain-db"
          security set-keychain-settings -lut 21600 "$PWD/testplace/tmp/credentials.keychain-db"
          security unlock-keychain -p ligule-ci-test-password "$PWD/testplace/tmp/credentials.keychain-db"
          security list-keychains -d user -s "$PWD/testplace/tmp/credentials.keychain-db"
          security default-keychain -d user -s "$PWD/testplace/tmp/credentials.keychain-db"
      - name: native credential operations on Windows and macOS
        if: runner.os != 'Linux'
        env:
          LIGULE_CREDENTIAL_NATIVE_REQUIRED: '1'
        run: node --test test/credentials.test.js test/credential-unavailable.test.js
      - name: remove the test keychain
        if: always() && runner.os == 'macOS' && steps.keychain.outcome == 'success'
        run: security delete-keychain "$PWD/testplace/tmp/credentials.keychain-db"

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm

      # 依赖按锁文件装，CI 上不解析新版本。
      - name: install
        run: npm ci

      - name: syntax check every module
        shell: bash
        run: |
          set -e
          for f in $(find src scripts test -name '*.js'); do node --check "$f"; done

      - name: test
        run: npm test

      # 发布物检查：npm pack 一次，解开产物，按 package.json 声明的入口逐个查文件在不在，
      # 再把解出来的目录当成已经安装好的包 import 一次。npm test 从 src/ 直接导入，看不到这两类问题。
      - name: check the packed artifact
        run: npm run check-pack

      # 全新安装那一份：tarball 装进一个空目录，依赖按声明解析并下载，再查版本、工具数、TUI 那一条拒绝、
      # 两种命令语法与搜索后端。check-pack 从开发树复制依赖，证明不了「声明装得出来」。
      - name: install the packed artifact into an empty directory
        run: npm run verify-install

  # 桌面壳（D34、D106）：四行目标各在一具本机平台上构出来，产物只上传成检查用的附件，不发 Release。
  # 每一行的安装包类型来自 `desktop/src-tauri/tauri.<平台>.conf.json`，不在主配置里塞一张跨平台的清单：
  # Tauri 的 `bundle.targets` 只有「全部」与「一份清单」两种形状，写进主配置就会在 Windows 上连 MSI 一起打出来。
  # 构建在前端与 Rust 之间只有编译期那一次资源嵌入，本地不构建就等不到改完界面才发现打不出来。不签名，装完之后首次运行会有操作系统的一次警告。
  desktop:
    name: desktop shell on ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            node: ./desktop/vendor/node/node.exe
            artifact: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - id: linux-x64
            # AppImage 的那一份 glibc 由构建机的版本决定，所以用最旧的一条支持线当构建宿主（RELEASE.md 那一句）。
            os: ubuntu-22.04
            node: ./desktop/vendor/node/node
            artifact: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
          - id: macos-arm64
            os: macos-15
            node: ./desktop/vendor/node/node
            artifact: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - id: macos-x64
            # 两种 macOS 架构分别使用本机运行时构建和检查。
            os: macos-15-intel
            node: ./desktop/vendor/node/node
            artifact: desktop/src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
            desktop/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Tauri 在 Linux 上要的成套系统库：WebKitGTK 4.1、AppIndicator、librsvg、`file` 这几样（官方列表里的那一串）。
      # AppImage 那一份还要 FUSE 2：`appimagetool` 不带 `--appimage-extract-and-run` 时自己去挂那枚镜像，
      # 而 ubuntu-24.04 的镜像里没有 `libfuse2` 这个包名（它改名成 `libfuse2t64`）。两个名字各试一次，两种镜像都走得通。
      - name: install the shell's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: install
        run: |
          npm ci
          npm --prefix desktop ci
          npm --prefix desktop/frontend ci

      - name: core checks on this target
        run: npm test

      - name: pack and install the artifact on this target
        run: |
          npm run check-pack
          npm run verify-install

      # 安装包带的是构建产物，所以先构建再复制（D47）。
      - name: build the runtime tree the installer carries
        run: npm run build

      # 安装包自带一份 Node 运行时与运行时树（D34），先按 pin 拉下来并核对校验和。
      # 这一步要排在任何 cargo 调用之前：`bundle.resources` 指的那两个目录得在编译期就在，
      # 不然 tauri-build 直接失败在「resource path `../vendor/app` doesn't exist」（2026-10-02 的 CI 就这么红过一次）。
      - name: vendor the runtime the installer carries
        run: node desktop/fetch-runtime.mjs

      # 随包带的那一份要能自己跑起来：用带进去的 node 跑带进去的入口，不借 PATH 上的 node。
      # 工具是数出来的：D3 那八件加上一件第一方可选工具 `fetch`（D48），少一件就说明运行时树缺了东西。
      # 三平台各数一遍：原生依赖装没装上，这一条比安装包先说话。
      - name: run the vendored tree on its own
        shell: bash
        run: ${{ matrix.node }} ./desktop/check-runtime.mjs

      # 壳的 Rust 一侧自己那两件事（从可执行文件位置找后端入口、帧在子进程两根管道之间按行转递）与格式。
      # 这一段不跑就等于壳的测试只在本地跑过，而安装包照样能打出来。
      - name: check the shell's Rust side
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test

      # 壳的构建入口在 desktop/（Tauri 命令行认 src-tauri 是它的直接子目录），它会先把前端构出 dist/。
      - name: build the installer
        run: npm --prefix desktop run build -- --verbose

      # 检查生成的安装包本身也带有目标平台的 Node、依赖树和 ripgrep 可选二进制。
      - name: install the Windows bundle and check its runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'the NSIS installer was not produced' }
          $installation = Join-Path $env:RUNNER_TEMP 'ligule-bundle-smoke'
          $result = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installation") -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0) { throw "the NSIS installer exited with $($result.ExitCode)" }
          $app = Join-Path $installation 'app'
          $node = Join-Path $installation 'node/node.exe'
          if (-not (Test-Path -LiteralPath (Join-Path $app 'node_modules/@vscode/ripgrep-win32-x64/bin/rg.exe'))) {
            throw 'the installed bundle is missing @vscode/ripgrep-win32-x64'
          }
          $env:LIGULE_RUNTIME_APP_DIR = $app
          $env:LIGULE_RUNTIME_NODE_PATH = $node
          & $node desktop/check-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw "the installed runtime check exited with $LASTEXITCODE" }

      - name: extract Linux bundles and check their runtimes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/ligule-bundle-smoke"
          mkdir -p "$scratch"
          verify_runtime() {
            local root="$1"
            local manifest app resources node
            manifest=$(find "$root" -type f -path '*/app/package.json' -print -quit)
            test -n "$manifest"
            app="${manifest%/package.json}"
            resources="${app%/app}"
            node="$resources/node/node"
            test -x "$node"
            LIGULE_RUNTIME_APP_DIR="$app" LIGULE_RUNTIME_NODE_PATH="$node" "$node" desktop/check-runtime.mjs
          }
          index=0
          for package in desktop/src-tauri/target/release/bundle/deb/*.deb; do
            destination="$scratch/deb-$index"
            mkdir -p "$destination"
            dpkg-deb --extract "$package" "$destination"
            verify_runtime "$destination"
            index=$((index + 1))
          done
          index=0
          for image in desktop/src-tauri/target/release/bundle/appimage/*.AppImage; do
            archive="$PWD/$image"
            destination="$scratch/appimage-$index"
            mkdir -p "$destination"
            (cd "$destination" && "$archive" --appimage-extract >/dev/null)
            verify_runtime "$destination/squashfs-root"
            index=$((index + 1))
          done

      - name: verify the macOS signature and disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for image in desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$image"
            mount_point=$(mktemp -d "$RUNNER_TEMP/ligule-dmg.XXXXXX")
            hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount_point"
            trap 'hdiutil detach "$mount_point"' EXIT
            codesign --verify --deep --strict "$mount_point/ligule.app"
            codesign --display --verbose=4 "$mount_point/ligule.app" 2>&1 | grep 'Signature=adhoc'
            app="$mount_point/ligule.app/Contents/Resources/app"
            node="$mount_point/ligule.app/Contents/Resources/node/node"
            LIGULE_RUNTIME_APP_DIR="$app" LIGULE_RUNTIME_NODE_PATH="$node" "$node" desktop/check-runtime.mjs
            hdiutil detach "$mount_point"
            trap - EXIT
            rmdir "$mount_point"
          done

      - name: show what was bundled
        shell: bash
        run: ls -l desktop/src-tauri/target/release/bundle/*/

      - uses: actions/upload-artifact@v4
        with:
          name: ligule-desktop-${{ matrix.id }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
