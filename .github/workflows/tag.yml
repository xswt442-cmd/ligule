name: product-tag

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product with an independent version and changelog
        type: choice
        required: true
        options: [cli, desktop]
      version:
        description: Version X.Y.Z already reviewed on the current main commit
        type: string
        required: true

env:
  PRIMARY_NODE_VERSION: '24'

concurrency:
  group: product-tag-${{ inputs.product }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      product: ${{ inputs.product }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: require the default branch
        run: test "$GITHUB_REF" = refs/heads/main

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: validate product version, changelog, main ancestry, and CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must use stable X.Y.Z form"; exit 1
          fi
          TAG="${PRODUCT}-v${VERSION}"
          if [ "$PRODUCT" = cli ]; then manifest=tui/package.json; else manifest=desktop/package.json; fi
          test "$(node -p "require('./$manifest').version")" = "$VERSION"
          node scripts/release-notes.js "$TAG" >/dev/null
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists"; exit 1
          fi
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          main_head=$(git rev-parse refs/remotes/origin/main)
          if [ "$commit" != "$main_head" ]; then echo "::error::main moved before tagging"; exit 1; fi
          run_json=$(gh run list --workflow ci.yml --branch main --event push --commit "$commit" --limit 100 --json databaseId,headSha,status,conclusion,createdAt \
            | jq -c --arg commit "$commit" '[.[] | select(.headSha == $commit)] | sort_by(.createdAt) | reverse | .[0] // empty')
          if [ -z "$run_json" ]; then echo "::error::no main push CI run exists for $commit"; exit 1; fi
          run_id=$(jq -r .databaseId <<< "$run_json")
          gh run watch "$run_id" --exit-status
          result=$(gh run view "$run_id" --json headSha,conclusion)
          if [ "$(jq -r .headSha <<< "$result")" != "$commit" ] || [ "$(jq -r .conclusion <<< "$result")" != success ]; then
            echo "::error::full CI did not pass for $commit"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ci_url=$(gh run view "$run_id" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: create and push the annotated product tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          CI_URL: ${{ steps.release.outputs.ci_url }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$COMMIT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "Created ${TAG} from ${COMMIT}. CI: ${CI_URL}" >> "$GITHUB_STEP_SUMMARY"

  # A GITHUB_TOKEN tag push does not trigger push workflows, but a workflow_dispatch
  # issued with it starts the publication workflow normally.
  dispatch:
    name: dispatch the product publication workflow
    needs: create-tag
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: start the publication workflow for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-tag.outputs.tag }}
          PRODUCT: ${{ needs.create-tag.outputs.product }}
        shell: bash
        run: |
          if [ "$PRODUCT" = cli ]; then
            gh workflow run npm-publish.yml --ref main -f tag="$TAG"
          else
            gh workflow run desktop-publish.yml --ref main -f tag="$TAG" -f publish=false
          fi
          echo "Dispatched publication for ${TAG}." >> "$GITHUB_STEP_SUMMARY"
