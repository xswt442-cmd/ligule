name: product-tag

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product with an independent version and changelog
        type: choice
        required: true
        options: [cli, desktop]
      version:
        description: Version X.Y.Z already reviewed on the current branch head
        type: string
        required: true

env:
  PRIMARY_NODE_VERSION: '24'

concurrency:
  group: product-tag-${{ inputs.product }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: require a release branch
        run: |
          case "$GITHUB_REF_NAME" in
            main|dev) ;;
            *) echo "::error::tags are cut from the main or dev branch head, got $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: validate product version, changelog, branch head, and CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must use stable X.Y.Z form"; exit 1
          fi
          TAG="${PRODUCT}-v${VERSION}"
          if [ "$PRODUCT" = cli ]; then manifest=tui/package.json; else manifest=desktop/package.json; fi
          test "$(node -p "require('./$manifest').version")" = "$VERSION"
          node scripts/release-notes.js "$TAG" >/dev/null
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists"; exit 1
          fi
          # Tags are cut from the release branch head; main merges back from dev asynchronously
          # and is not a publication prerequisite.
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          git fetch --no-tags --force origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          test "$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")" = "$commit"
          run_json=$(gh run list --workflow ci.yml --event push --commit "$commit" --limit 100 --json databaseId,headSha,status,conclusion,createdAt \
            | jq -c --arg commit "$commit" '[.[] | select(.headSha == $commit)] | sort_by(.createdAt) | reverse | .[0] // empty')
          if [ -z "$run_json" ]; then echo "::error::no push CI run exists for $commit on ${GITHUB_REF_NAME}"; exit 1; fi
          run_id=$(jq -r .databaseId <<< "$run_json")
          gh run watch "$run_id" --exit-status
          result=$(gh run view "$run_id" --json headSha,conclusion)
          if [ "$(jq -r .headSha <<< "$result")" != "$commit" ] || [ "$(jq -r .conclusion <<< "$result")" != success ]; then
            echo "::error::full CI did not pass for $commit"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ci_url=$(gh run view "$run_id" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: create and push the annotated product tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          CI_URL: ${{ steps.release.outputs.ci_url }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          test "$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")" = "$COMMIT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "Created ${TAG} from ${COMMIT} (${GITHUB_REF_NAME}). CI: ${CI_URL}" >> "$GITHUB_STEP_SUMMARY"
