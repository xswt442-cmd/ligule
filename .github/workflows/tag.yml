name: product-tag

on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare a product version PR or tag its reviewed main commit
        type: choice
        required: true
        options: [prepare, tag]
      product:
        description: Product with an independent version and changelog
        type: choice
        required: true
        options: [cli, desktop]
      version:
        description: Stable X.Y.Z, or patch/minor/major for prepare
        type: string
        required: true

env:
  PRIMARY_NODE_VERSION: '24'

concurrency:
  group: product-tag-${{ inputs.product }}-${{ inputs.action }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: inputs.action == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: require the default branch
        run: test "$GITHUB_REF" = refs/heads/main

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: resolve product version and prepare its release files
        id: version
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$(node scripts/release-version.js resolve "$PRODUCT" "$REQUESTED_VERSION")
          tag="${PRODUCT}-v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists"
            exit 1
          fi
          branch="release/${tag}"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "::error::branch ${branch} already exists; inspect it before retrying"
            exit 1
          fi
          git switch -c "$branch"
          node scripts/release-version.js prepare "$PRODUCT" "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: push the product version branch
        id: push
        env:
          PRODUCT: ${{ inputs.product }}
          BRANCH: ${{ steps.version.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PRODUCT" = cli ]; then
            git add package.json src/version.ts CHANGELOG.md
          else
            git add desktop/package.json desktop/CHANGELOG.md
          fi
          git commit -m "chore(release): ${TAG}"
          git push origin "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: run the full platform CI for the version commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
          COMMIT: ${{ steps.push.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --ref "$BRANCH"
          run_id=""
          for attempt in $(seq 1 60); do
            run_id=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt \
              | jq -r --arg commit "$COMMIT" --arg since "$dispatched_at" '[.[] | select(.headSha == $commit and (.createdAt | fromdateiso8601) >= ($since | fromdateiso8601))][0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then echo "::error::could not find CI run for $COMMIT"; exit 1; fi
          gh run watch "$run_id" --exit-status
          echo "url=$(gh run view "$run_id" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: open the product version pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          BRANCH: ${{ steps.version.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          CI_URL: ${{ steps.ci.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          ## Product version preparation

          - Updates only the ${PRODUCT} product version and changelog for `${TAG}`.
          - Frozen workspace dependencies and the full four-target CI passed for this version commit: ${CI_URL}

          Review the version diff and CI result, then merge this PR into `main`. Desktop installers will be rebuilt from the exact tagged commit after tagging.
          EOF
          gh pr create --base main --head "$BRANCH" --title "chore(release): ${TAG}" --body-file "$RUNNER_TEMP/release-pr.md"

  create-tag:
    if: inputs.action == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: require the default branch
        run: test "$GITHUB_REF" = refs/heads/main

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: validate product version, changelog, main ancestry, and CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must use stable X.Y.Z form"; exit 1
          fi
          TAG="${PRODUCT}-v${VERSION}"
          if [ "$PRODUCT" = cli ]; then manifest=package.json; else manifest=desktop/package.json; fi
          test "$(node -p "require('./$manifest').version")" = "$VERSION"
          node scripts/release-notes.js "$TAG" >/dev/null
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists"; exit 1
          fi
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          main_head=$(git rev-parse refs/remotes/origin/main)
          if [ "$commit" != "$main_head" ]; then echo "::error::main moved before tagging"; exit 1; fi
          run_json=$(gh run list --workflow ci.yml --branch main --event push --commit "$commit" --limit 100 --json databaseId,headSha,status,conclusion,createdAt \
            | jq -c --arg commit "$commit" '[.[] | select(.headSha == $commit)] | sort_by(.createdAt) | reverse | .[0] // empty')
          if [ -z "$run_json" ]; then echo "::error::no main push CI run exists for $commit"; exit 1; fi
          run_id=$(jq -r .databaseId <<< "$run_json")
          gh run watch "$run_id" --exit-status
          result=$(gh run view "$run_id" --json headSha,conclusion)
          if [ "$(jq -r .headSha <<< "$result")" != "$commit" ] || [ "$(jq -r .conclusion <<< "$result")" != success ]; then
            echo "::error::full CI did not pass for $commit"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ci_url=$(gh run view "$run_id" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: create and push the annotated product tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          CI_URL: ${{ steps.release.outputs.ci_url }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$COMMIT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "Created ${TAG} from ${COMMIT}. CI: ${CI_URL}" >> "$GITHUB_STEP_SUMMARY"
