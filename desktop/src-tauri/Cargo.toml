[package]
name = "ligule-desktop"
version = "0.0.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# `tray-icon` 是 tauri 自己那一枚开关：点叉收起之后要有一个能把窗口找回来的位置（方案 6.4）。
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.1"
notify-rust = "=4.18.2"
tauri-plugin-notification = "=2.5.1"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "=0.18.4"

# 这一层管理窗口、Host 进程、原生通知、托盘和保存对话框，不解释 Host 调用帧中的业务内容。
